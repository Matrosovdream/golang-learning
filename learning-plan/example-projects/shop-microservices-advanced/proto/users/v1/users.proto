syntax = "proto3";

package users.v1;

option go_package = "shop/proto/users/v1;usersv1";

// UsersService owns user accounts.
service UsersService {
  rpc CreateUser(CreateUserRequest) returns (User);
  rpc GetUser(GetUserRequest) returns (User);
}

message User {
  int64 id = 1;
  string email = 2;
  string name = 3;
  string created_at = 4;
}

message CreateUserRequest {
  string email = 1;
  string name = 2;
}

message GetUserRequest {
  int64 id = 1;
}
