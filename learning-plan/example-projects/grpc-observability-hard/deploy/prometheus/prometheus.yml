# Prometheus scrapes each gRPC service's /metrics every 5s. The service names are
# resolved by Docker Compose DNS, the same way the services find each other.
global:
  scrape_interval: 5s
  evaluation_interval: 5s

scrape_configs:
  - job_name: catalog
    static_configs:
      - targets: ["catalog:2112"]

  - job_name: orders
    static_configs:
      - targets: ["orders:2112"]

  - job_name: prometheus
    static_configs:
      - targets: ["localhost:9090"]
