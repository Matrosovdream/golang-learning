services:
  # catalog: gRPC on :9002 (internal), /metrics on :2112 (published for manual curl).
  catalog:
    build: { context: ., dockerfile: services/catalog/Dockerfile }
    environment:
      GRPC_PORT: "9002"
      METRICS_PORT: "2112"
    ports:
      - "2112:2112" # curl localhost:2112/metrics

  # orders: gRPC on :9003 (internal); calls catalog by Compose DNS.
  orders:
    build: { context: ., dockerfile: services/orders/Dockerfile }
    environment:
      GRPC_PORT: "9003"
      METRICS_PORT: "2112"
      CATALOG_ADDR: catalog:9002
    ports:
      - "2113:2112" # curl localhost:2113/metrics
    depends_on:
      catalog: { condition: service_started }

  # gateway: the only truly public service (REST).
  gateway:
    build: { context: ., dockerfile: services/gateway/Dockerfile }
    environment:
      HTTP_PORT: "8080"
      CATALOG_ADDR: catalog:9002
      ORDERS_ADDR: orders:9003
    ports:
      - "${GATEWAY_PORT:-8080}:8080"
    depends_on:
      catalog: { condition: service_started }
      orders: { condition: service_started }
