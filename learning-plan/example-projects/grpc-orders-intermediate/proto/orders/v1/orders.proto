syntax = "proto3";

package orders.v1;

option go_package = "grpcorders/proto/orders/v1;ordersv1";

// OrderService places orders. During checkout it calls the catalog service to
// reserve stock and snapshot prices — a live gRPC fan-out.
service OrderService {
  rpc CreateOrder(CreateOrderRequest) returns (Order);
  rpc GetOrder(GetOrderRequest) returns (Order);
}

message OrderItem {
  int64 product_id = 1;
  int32 quantity = 2;
  string name = 3;        // snapshot from catalog at checkout time
  int64 price_cents = 4;  // snapshot from catalog at checkout time
}

message Order {
  int64 id = 1;
  string status = 2;       // "confirmed"
  int64 total_cents = 3;
  repeated OrderItem items = 4;
}

message CreateOrderLine {
  int64 product_id = 1;
  int32 quantity = 2;
}

message CreateOrderRequest {
  repeated CreateOrderLine items = 1;
}

message GetOrderRequest { int64 id = 1; }
